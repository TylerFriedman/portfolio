<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" shape-rendering="crispEdges" font-family="Tahoma, Verdana, sans-serif" font-size="11">
  <!-- colours come from xp paint's default palette -->
  <defs>
    <!-- wobbles the shapes so they look drawn by mouse -->
    <filter id="hand" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#ffffff"/>

  <g filter="url(#hand)" stroke="#000000" stroke-width="2">
    <!-- person -->
    <g fill="none">
      <circle cx="40" cy="14" r="7"/>
      <path d="M40 21v16M30 27h20M40 37l-8 12M40 37l8 12"/>
    </g>

    <!-- zones -->
    <rect x="10" y="70" width="200" height="270" fill="#ffffff"/>
    <rect x="10" y="70" width="200" height="20" fill="#008000"/>
    <rect x="230" y="70" width="180" height="130" fill="#ffffff"/>
    <rect x="230" y="70" width="180" height="20" fill="#800000"/>
    <rect x="230" y="210" width="180" height="130" fill="#ffffff"/>
    <rect x="230" y="210" width="180" height="20" fill="#000080"/>
    <rect x="430" y="70" width="200" height="270" fill="#ffffff"/>
    <rect x="430" y="70" width="200" height="20" fill="#008080"/>

    <!-- app boxes -->
    <g fill="#ffff80">
      <rect x="20" y="98" width="180" height="26"/>
      <rect x="20" y="132" width="180" height="26"/>
      <rect x="20" y="166" width="180" height="26"/>
      <rect x="20" y="200" width="180" height="26"/>
      <rect x="20" y="234" width="180" height="26"/>
      <rect x="20" y="268" width="180" height="26"/>
      <rect x="20" y="302" width="180" height="26"/>
    </g>

    <!-- firebase -->
    <g fill="#ff8040">
      <path d="M255 112v66a65 10 0 0 0 130 0v-66"/>
      <ellipse cx="320" cy="112" rx="65" ry="10"/>
    </g>

    <!-- other apis -->
    <g fill="#ffffff">
      <rect x="240" y="246" width="160" height="26"/>
      <rect x="240" y="290" width="160" height="26"/>
    </g>

    <!-- our api's shopping list flow -->
    <g fill="#80ffff">
      <rect x="440" y="98" width="180" height="26"/>
      <rect x="440" y="149" width="180" height="26"/>
      <rect x="440" y="200" width="180" height="26"/>
      <rect x="440" y="251" width="180" height="26"/>
      <rect x="440" y="302" width="180" height="26"/>
    </g>
    <g marker-end="url(#head)">
      <path d="M530 126V147"/>
      <path d="M530 177V198"/>
      <path d="M530 228V249"/>
      <path d="M530 279V300"/>
    </g>

    <!-- connections -->
    <g fill="none" marker-start="url(#head)" marker-end="url(#head)">
      <path d="M150 67V54H530V67"/>
      <path d="M212 150H253"/>
      <path d="M428 150H387"/>
      <path d="M212 281H228"/>
      <path d="M428 259H402"/>
    </g>
  </g>

  <text x="58" y="32">Users</text>
  <text x="340" y="47" text-anchor="middle">sends a recipe ID, with the user’s login token</text>
  <g fill="#ffffff" font-weight="bold" text-anchor="middle">
    <text x="110" y="84">ANDROID APP · Kotlin</text>
    <text x="320" y="84">FIREBASE</text>
    <text x="320" y="224">OTHER APIs</text>
    <text x="530" y="84">OUR API · Express on Render</text>
  </g>
  <g text-anchor="middle">
    <text x="110" y="115">Username + fingerprint login</text>
    <text x="110" y="149">Recipe search + filters</text>
    <text x="110" y="183">Recipe tabs + nutrition</text>
    <text x="110" y="217">Favourites (work offline)</text>
    <text x="110" y="251">Shopping list</text>
    <text x="110" y="285">Meal planner + reminders</text>
    <text x="110" y="319">Unit converter</text>
    <text x="320" y="140" font-weight="bold">Auth</text>
    <text x="320" y="154">Realtime Database</text>
    <text x="320" y="168">lists, plans, favourites</text>
    <text x="320" y="263">Spoonacular (recipes)</text>
    <text x="320" y="307">Google Translate</text>
    <text x="530" y="115">Checks the login token</text>
    <text x="530" y="166">Takes the recipe ID</text>
    <text x="530" y="217">Gets ingredients (Spoonacular)</text>
    <text x="530" y="268">Groups them by aisle</text>
    <text x="530" y="319">Saves to the shopping list</text>
    <text x="320" y="368" fill="#808080">The app talks to Firebase itself, but adding a recipe to the shopping list goes through our API.</text>
  </g>
</svg>
